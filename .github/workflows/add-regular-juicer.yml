name: Add Regular Juicer Jar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add inventory item
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('inventory.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          category = next(c for c in data['categories'] if c['name'] == 'Juicer Jar')
          item = {
              'code': '5353',
              'name': 'Regular Juicer Jar',
              'qty': '3 Units',
              'mrp': '₹350/unit',
              'brand': ''
          }

          if not any(i.get('code') == item['code'] and i.get('name') == item['name'] for i in category['items']):
              category['items'].append(item)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit inventory update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json .github/workflows/add-regular-juicer.yml
          git rm .github/workflows/add-regular-juicer.yml
          git commit -m "Add Regular Juicer Jar to inventory"
          git push

name: Add inventory items

on:
  push:
    paths:
      - '.github/workflows/add-inventory-items.yml'

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add new inventory items
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('inventory.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          additions = {
              'Masala Dabba': [
                  {'code': '45103', 'name': 'Mazda Masala Dabba 7 Masala Wati with Spoon', 'qty': '2 Boxes', 'mrp': '₹1089', 'brand': 'Mazda'}
              ],
              'Glass Sets': [
                  {'code': '572976', 'name': 'Super Mom Casa glass - 6pcs set', 'qty': '1 Box', 'mrp': '₹299', 'brand': 'Super Mom'}
              ],
              'Other Kitchenware': [
                  {'code': '', 'name': 'Mithra Puttu Maker', 'qty': '1 Box', 'mrp': '₹600', 'brand': 'Mithra'},
                  {'code': '695853', 'name': 'Square Glass Crisper', 'qty': '1 Box', 'mrp': '₹600', 'brand': ''}
              ]
          }
          categories = {c['name']: c for c in data['categories']}
          for category_name, items in additions.items():
              category = categories.get(category_name)
              if category is None:
                  category = {'name': category_name, 'items': []}
                  data['categories'].append(category)
              for item in items:
                  if not any(existing.get('code') == item.get('code') and existing.get('name') == item.get('name') for existing in category['items']):
                      category['items'].append(item)
          data['categories'].sort(key=lambda c: c['name'].lower())
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit inventory update and remove temporary workflow
        run: |
          rm -f .github/workflows/add-inventory-items.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory.json .github/workflows/add-inventory-items.yml
          git commit -m 'Add latest inventory items'
          git push

name: Add photo inventory placeholders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add placeholder products
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path('inventory.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          names = [
              'PATEL Big Star Insulated Lunch Pack',
              'PATEL KitKat Insulated Lunch Pack',
              'PATEL KitKat Insulated Lunch Pack',
              'PATEL Big Star Insulated Lunch Pack with S.S. Plate Inner',
              'Lunch Box Boutique Products 630ml',
              'Lunch Box Boutique Products 630ml',
              'SC Borneo Insulated Lunch Carrier',
              'Lunchmate Eagle Insulated Lunch Carrier',
              'Zig Zag 1 Handle with Belt Insulated Lunch Carrier',
              'Sweet & Salty Big Lunch Pack',
              'Milton Legend 2 Thermo Container',
              'SC Borneo Food Container',
              'SC Borneo Food Container',
              'PATEL Big Star Lunch Pack',
          ]

          category_name = 'Lunch Boxes & Carriers'
          category = next((c for c in data['categories'] if c.get('name','').lower() == category_name.lower()), None)
          if category is None:
              category = {'name': category_name, 'items': []}
              data['categories'].append(category)

          for name in names:
              category['items'].append({
                  'code': '',
                  'name': name,
                  'qty': '',
                  'mrp': '',
                  'brand': ''
              })

          data['categories'].sort(key=lambda c: c.get('name','').lower())
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit inventory update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json
          git commit -m "Add placeholder products from shelf photo"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/add-photo-placeholders.yml || true
          git commit -m "Remove temporary photo inventory workflow" || true
          git push || true

name: Normalize Idli terminology

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Idly with Idli
        shell: bash
        run: |
          find . -type f ! -path './.git/*' ! -path './.github/*' -not -name '*.png' -not -name '*.jpg' -not -name '*.jpeg' -not -name '*.webp' -print0 | xargs -0 grep -Il 'Idly\|idly\|IDLY' | while IFS= read -r file; do
            sed -i -e 's/Idly/Idli/g' -e 's/idly/idli/g' -e 's/IDLY/IDLI/g' "$file"
          done

      - name: Commit terminology fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No terminology changes needed.'
          else
            git commit -m 'Normalize Idly to Idli terminology'
            git push
          fi

name: Add Cups and Kudam Inventory
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('inventory.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          cats = data['categories']
          def cat(name):
              for c in cats:
                  if c['name'].lower() == name.lower():
                      return c
              c = {'name': name, 'items': []}
              cats.append(c)
              return c
          cups = cat('Cups & Saucers')
          cups['items'].extend([
              {'code':'','name':'RK Plastoware 222 Steel Cup With Lid - 6pcs/Box 350ml','qty':'2 Boxes · 6 pcs/box','mrp':'₹126/pc, ₹756/Box','brand':'RK Plastoware'},
              {'code':'','name':'Cello Designer Crockery Cup and Saucer - 12pcs (6 Cups 6 Saucers) Blossom','qty':'Boxes','mrp':'₹799','brand':'Cello'},
              {'code':'','name':'Cello Designer Crockery Cup and Saucer - 12pcs (6 Cups 6 Saucers) Livid Lilac','qty':'Boxes','mrp':'₹799','brand':'Cello'},
              {'code':'','name':'Cello Designer Crockery Cup and Saucer - 12pcs (6 Cups 6 Saucers) Magical Star','qty':'Boxes','mrp':'₹799','brand':'Cello'},
              {'code':'','name':'Cello Designer Crockery Cup and Saucer - 8pcs (4 Cups 4 Saucers) Hanging Garden','qty':'Boxes','mrp':'₹595','brand':'Cello'},
          ])
          storage = cat('Storage Containers')
          storage['items'].append({'code':'SSPK','name':'Sheetal Putti Kudam','qty':'4 Boxes','mrp':'₹499','brand':'Sheetal'})
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json
          git diff --cached --quiet || git commit -m "Add cups, saucers and kudam inventory"
          git push

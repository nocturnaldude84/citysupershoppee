name: Move Mithra Puttu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Mithra Puttu and remove placeholder
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('inventory.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          cats = data['categories']
          def find(name):
              return next((c for c in cats if c.get('name','').lower() == name.lower()), None)
          puttu = find('Puttu Maker')
          if not puttu:
              puttu = {'name':'Puttu Maker','items':[]}
              cats.append(puttu)
          moved = []
          for cat in cats:
              if cat is puttu:
                  continue
              kept = []
              for item in cat.get('items', []):
                  name = item.get('name','').strip().lower()
                  if 'mithra' in name and 'puttu' in name:
                      # Remove the empty placeholder created previously, but preserve
                      # the actual existing Mithra product details.
                      if item.get('qty','').strip() or item.get('mrp','').strip() or item.get('code','').strip():
                          moved.append(item)
                  else:
                      kept.append(item)
              cat['items'] = kept
          # Remove any placeholder Mithra Puttu Maker in Puttu Maker.
          puttu['items'] = [i for i in puttu.get('items', []) if not (
              i.get('name','').strip().lower() == 'mithra puttu maker' and
              not i.get('code','').strip() and not i.get('qty','').strip() and not i.get('mrp','').strip()
          )]
          for item in moved:
              if not any(i == item for i in puttu['items']):
                  puttu['items'].append(item)
          cats.sort(key=lambda c: c.get('name','').lower())
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit inventory and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json
          git rm .github/workflows/move-mithra-puttu.yml
          git commit -m "Move Mithra Puttu to Puttu Maker"
          git push

name: Fix Puttu Inventory
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('inventory.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          cats = data['categories']
          def find(name):
              return next((c for c in cats if c.get('name','').lower() == name.lower()), None)
          # Remove the incorrectly categorized Sheetal entry.
          storage = find('Storage Containers')
          if storage:
              storage['items'] = [i for i in storage['items'] if i.get('name','').lower() not in ('sheetal putti kudam','sheetal puttu kudam') and i.get('code','') != 'SSPK']
          puttu = find('Puttu Maker')
          if not puttu:
              puttu = {'name':'Puttu Maker','items':[]}
              cats.append(puttu)
          # Correct Sheetal spelling and retain its known details.
          sheetal = {'code':'SSPK','name':'Sheetal Puttu Kudam','qty':'4 Boxes','mrp':'₹499','brand':'Sheetal'}
          if not any(i.get('code') == 'SSPK' or i.get('name') == sheetal['name'] for i in puttu['items']):
              puttu['items'].append(sheetal)
          # Add Mithra Puttu product as a placeholder because no code/quantity/MRP was supplied.
          mithra = {'code':'','name':'Mithra Puttu Maker','qty':'','mrp':'','brand':'Mithra'}
          if not any(i.get('name') == mithra['name'] for i in puttu['items']):
              puttu['items'].append(mithra)
          cats.sort(key=lambda c: c.get('name','').lower())
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json
          git diff --cached --quiet || git commit -m "Fix Puttu Maker inventory"
          git push

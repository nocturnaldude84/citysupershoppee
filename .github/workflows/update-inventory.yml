name: Update Inventory

on:
  push:
    paths:
      - "inventory-additions.json"

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply inventory additions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          inv_path = Path("inventory.json")
          additions_path = Path("inventory-additions.json")
          data = json.loads(inv_path.read_text(encoding="utf-8"))
          additions = json.loads(additions_path.read_text(encoding="utf-8"))

          categories = data.setdefault("categories", [])
          addition_categories = additions.get("categories", [])

          for addition_category in addition_categories:
              category_name = addition_category["name"]
              category = next((c for c in categories if c.get("name", "").casefold() == category_name.casefold()), None)
              if category is None:
                  category = {"name": category_name, "items": []}
                  categories.append(category)

              for item in addition_category.get("items", []):
                  exists = any(
                      (item.get("code") and x.get("code") == item.get("code") and x.get("name", "").casefold() == item.get("name", "").casefold()) or
                      (x.get("name", "").casefold() == item.get("name", "").casefold())
                      for x in category.get("items", [])
                  )
                  if not exists:
                      category.setdefault("items", []).append(item)

          categories.sort(key=lambda c: c.get("name", "").casefold())
          for category in categories:
              category["items"].sort(key=lambda x: x.get("name", "").casefold())

          inv_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          additions_path.unlink()
          PY
      - name: Commit inventory update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory.json inventory-additions.json
          git diff --cached --quiet || git commit -m "Add new inventory items"
          git push

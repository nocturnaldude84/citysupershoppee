name: Add Treo by Milton mug entries

on:
  push:
    paths:
      - '.github/workflows/add-treo-mugs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('inventory.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          categories = data['categories']
          target = next((c for c in categories if c['name'] == 'Cups & Saucers'), None)
          if target is None:
              target = {'name': 'Cups & Saucers', 'items': []}
              categories.append(target)
          new_items = [
              {'code':'234528','name':'Treo by Milton Munich Cool 359 Beer Mug Set 2 pcs','qty':'1 Box','mrp':'₹410','brand':'Treo by Milton'},
              {'code':'237710','name':'Treo by Milton Marble 240 Ceramic Mug Set 6pcs','qty':'3 Boxes','mrp':'₹1095','brand':'Treo by Milton'}
          ]
          for item in new_items:
              if not any(x.get('code') == item['code'] for c in categories for x in c.get('items', [])):
                  target['items'].append(item)
          categories.sort(key=lambda c: c['name'].casefold())
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory.json .github/workflows/add-treo-mugs.yml
          git commit -m 'Add Treo by Milton mug entries'
          git push

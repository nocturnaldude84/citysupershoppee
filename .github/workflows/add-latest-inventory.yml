name: Add latest inventory entries

on:
  push:
    paths:
      - '.github/workflows/add-latest-inventory.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('inventory.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          categories = data['categories']

          target = next((c for c in categories if c['name'] == 'Cups & Saucers'), None)
          if target is None:
              target = {'name': 'Cups & Saucers', 'items': []}
              categories.append(target)

          new_items = [
              {
                  'code': '131155',
                  'name': 'Treo Ceramicware Kidz - O - Pia 3pcs Breakfast Set',
                  'qty': '1 Box',
                  'mrp': '₹575',
                  'brand': 'Treo'
              },
              {
                  'code': '38164',
                  'name': 'Barista Stainless Steel Double Wall Cup Set - 6 pcs',
                  'qty': '4 Boxes',
                  'mrp': '₹450',
                  'brand': 'Barista'
              }
          ]

          for item in new_items:
              exists = any(
                  x.get('code') == item['code'] or x.get('name') == item['name']
                  for c in categories for x in c.get('items', [])
              )
              if not exists:
                  target['items'].append(item)

          categories.sort(key=lambda c: c['name'].casefold())
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit inventory update and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inventory.json .github/workflows/add-latest-inventory.yml
          git commit -m 'Add Treo and Barista inventory entries'
          git push

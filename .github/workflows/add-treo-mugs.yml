name: Add missing inventory entries

on:
  push:
    paths:
      - '.github/workflows/add-treo-mugs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('inventory.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          categories = data['categories']

          def get_category(name):
              target = next((c for c in categories if c['name'] == name), None)
              if target is None:
                  target = {'name': name, 'items': []}
                  categories.append(target)
              return target

          cups = get_category('Cups & Saucers')
          gas = get_category('Gas Stove Accessories')

          new_items = [
              (cups, {'code':'','name':'Mazda Classic Jumbo 6pcs','qty':'6 pcs/box','mrp':'₹1489/Box · ₹250/piece','brand':'Mazda'}),
              (cups, {'code':'','name':'Mazda Classic Large 6pcs','qty':'6 pcs/box','mrp':'₹1391/Box · ₹245/piece','brand':'Mazda'}),
              (cups, {'code':'','name':'Mazda Cuttee Jumbo 6pcs','qty':'6 pcs/box','mrp':'₹1693/Box · ₹295/piece','brand':'Mazda'}),
              (cups, {'code':'','name':'Mazda Cuttee Large 6pcs','qty':'6 pcs/box','mrp':'₹1391/Box · ₹245/piece','brand':'Mazda'}),
              (cups, {'code':'','name':'Mazda Opium Medium 6pcs','qty':'6 pcs/box','mrp':'₹1246/Box · ₹210/piece','brand':'Mazda'}),
              (gas, {'code':'C0220','name':'Stag Plus LPG PAN Support Stand','qty':'2 Boxes','mrp':'₹220','brand':'Stag Plus'}),
              (gas, {'code':'C0222','name':'Stag Plus LPG PAN Support Stand','qty':'2 Boxes','mrp':'₹220','brand':'Stag Plus'})
          ]

          for category, item in new_items:
              exists = any(
                  x.get('code') == item['code'] and x.get('name') == item['name']
                  for c in categories for x in c.get('items', [])
              ) if item['code'] else any(
                  x.get('name') == item['name']
                  for x in category.get('items', [])
              )
              if not exists:
                  category['items'].append(item)

          categories.sort(key=lambda c: c['name'].casefold())
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit inventory and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/add-treo-mugs.yml
          git add inventory.json .github/workflows/add-treo-mugs.yml
          git commit -m 'Add missing inventory entries'
          git push
